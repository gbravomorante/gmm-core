[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "gmm-core"
version = "0.1.0"
description = "Tested, transparent geometric morphometrics in Python: import, Procrustes, QC and permutation-based shape statistics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Guillermo Bravo Morante" }]
requires-python = ">=3.10"
keywords = [
    "geometric morphometrics", "procrustes", "landmarks", "shape analysis",
    "anthropology", "morphology", "RRPP", "thin-plate spline",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
examples = ["matplotlib>=3.8"]

[project.urls]
Homepage = "https://gbravomorante.dev"
Source = "https://github.com/gbravomorante/gmm-core"

[tool.hatch.build.targets.wheel]
packages = ["src/gmm_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905"]
